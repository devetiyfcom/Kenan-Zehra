<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Masa linkləri — Kənan & Zəhra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" />
<style>
  :root { --bg:#FBF8F1; --card:#fff; --gold:#B8862F; --gold2:#8a6420; --text:#4a3a22; --muted:#8a7a60; --line:#e6d8b8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Cormorant Garamond", Georgia, serif; font-size:17px; }
  main { max-width:520px; margin:0 auto; padding:28px 18px 60px; }
  h1 { font-family:"Great Vibes", cursive; font-weight:400; color:var(--gold); font-size:44px; text-align:center; margin:4px 0 0; }
  .sub { text-align:center; letter-spacing:.3em; font-size:11px; color:var(--muted); margin-bottom:26px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:18px; box-shadow:0 8px 24px rgba(184,134,47,.08); }
  .card h2 { margin:0 0 12px; font-size:15px; letter-spacing:.25em; color:var(--gold); font-weight:600; }
  label { display:block; font-size:12px; letter-spacing:.2em; color:var(--muted); margin:10px 0 6px; }
  input, textarea { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font:inherit; color:var(--text); background:#fffdf8; }
  textarea { min-height:150px; resize:vertical; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button, .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 16px; border-radius:999px; border:1px solid var(--gold); background:rgba(184,134,47,.1); color:var(--text); font:inherit; font-size:13px; letter-spacing:.15em; cursor:pointer; text-decoration:none; }
  button.primary { background:var(--gold); color:#fff; }
  .result { margin-top:14px; padding:12px; border-radius:12px; background:#fbf6ea; border:1px dashed var(--line); word-break:break-all; font-size:14px; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .list { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .item { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fffdf8; }
  .item b { color:var(--gold2); }
  .item .url { font-size:13px; color:var(--muted); word-break:break-all; margin:4px 0 8px; }
  .hint { font-size:13px; color:var(--muted); line-height:1.5; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<main>
  <h1>Kənan &amp; Zəhra</h1>
  <div class="sub">MASA LİNKLƏRİ</div>

  <div class="card">
    <h2>BİR QONAQ</h2>
    <div class="row">
      <div><label for="ad">AD (istəyə görə)</label><input id="ad" placeholder="məs. Elvin bəy" /></div>
      <div style="max-width:120px"><label for="masa">MASA №</label><input id="masa" inputmode="numeric" placeholder="12" /></div>
    </div>
    <div class="actions"><button class="primary" id="make">Link yarat</button></div>
    <div id="one" style="display:none">
      <div class="result" id="oneUrl"></div>
      <div class="actions">
        <button id="copyOne">Kopyala</button>
        <a class="btn" id="waOne" target="_blank" rel="noopener">WhatsApp-da göndər</a>
        <a class="btn" id="openOne" target="_blank" rel="noopener">Bax</a>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>SİYAHI İLƏ</h2>
    <p class="hint">Hər sətirdə bir qonaq: <b>Ad - masa</b>. Məsələn:<br>Elvin bəy - 5<br>Səbinə xanım - 12</p>
    <textarea id="bulk" placeholder="Elvin bəy - 5&#10;Səbinə xanım - 12"></textarea>
    <div class="actions">
      <button class="primary" id="makeAll">Linkləri yarat</button>
      <button id="copyAll" style="display:none">Hamısını kopyala</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</main>
<div class="toast" id="toast">Kopyalandı</div>
<script>
  var BASE = new URL("./", location.href).href; // dəvətnamənin əsas linki
  function linkFor(ad, masa) {
    var u = new URL(BASE);
    if (masa) u.searchParams.set("masa", masa);
    if (ad) u.searchParams.set("ad", ad);
    return u.toString();
  }
  function msgFor(ad, url) {
    return (ad ? "Hörmətli " + ad + ",\n" : "") + "Sizi Kənan və Zəhranın toyuna dəvət edirik 💍\n" + url;
  }
  function toast(t) { var el = document.getElementById("toast"); el.textContent = t || "Kopyalandı"; el.classList.add("show"); setTimeout(function(){ el.classList.remove("show"); }, 1400); }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(); }, fallback);
    else fallback();
    function fallback() { var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(); } catch (e) {} ta.remove(); }
  }
  function wa(text) { return "https://wa.me/?text=" + encodeURIComponent(text); }

  document.getElementById("make").onclick = function () {
    var ad = document.getElementById("ad").value.trim();
    var masa = document.getElementById("masa").value.trim();
    if (!masa) { toast("Masa nömrəsini yazın"); return; }
    var url = linkFor(ad, masa);
    document.getElementById("one").style.display = "block";
    document.getElementById("oneUrl").textContent = url;
    document.getElementById("copyOne").onclick = function(){ copy(msgFor(ad, url)); };
    document.getElementById("waOne").href = wa(msgFor(ad, url));
    document.getElementById("openOne").href = url;
  };

  var all = [];
  document.getElementById("makeAll").onclick = function () {
    var lines = document.getElementById("bulk").value.split(/\n+/);
    var list = document.getElementById("list"); list.innerHTML = ""; all = [];
    lines.forEach(function (line) {
      line = line.trim(); if (!line) return;
      var m = /^(.*?)[\s]*[-–—:,;]\s*(\S+)\s*$/.exec(line);
      var ad = m ? m[1].trim() : "", masa = m ? m[2].trim() : line;
      var url = linkFor(ad, masa); all.push(msgFor(ad, url));
      var item = document.createElement("div"); item.className = "item";
      item.innerHTML = "<div><b></b> · Masa <b></b></div><div class='url'></div><div class='actions'><button>Kopyala</button><a class='btn' target='_blank' rel='noopener'>WhatsApp</a></div>";
      var bs = item.querySelectorAll("b"); bs[0].textContent = ad || "Qonaq"; bs[1].textContent = masa;
      item.querySelector(".url").textContent = url;
      item.querySelector("button").onclick = function(){ copy(msgFor(ad, url)); };
      item.querySelector("a").href = wa(msgFor(ad, url));
      list.appendChild(item);
    });
    document.getElementById("copyAll").style.display = all.length ? "inline-flex" : "none";
  };
  document.getElementById("copyAll").onclick = function(){ copy(all.join("\n\n")); };
</script>
</body>
</html>
